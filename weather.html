<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #ffffff;
      color: #1f2937;
    }
    .card {
      padding: 18px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      border-left: 6px solid #8A1538;
      line-height: 1.8;
    }
    h3 {
      margin: 0 0 10px;
      color: #8A1538;
    }
    .value {
      font-weight: 700;
    }
    .time {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card" id="weather">讀取台南天氣中...</div>

  <script>
    const API_KEY = "CWA-4A2077C7-07B9-4F7C-9AC1-A25708AEB794";
    const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${API_KEY}&format=JSON&locationName=%E8%87%BA%E5%8D%97%E5%B8%82`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const loc = data.records.location[0];
        const elements = loc.weatherElement;

        const wx = elements.find(e => e.elementName === "Wx").time[0].parameter.parameterName;
        const pop = elements.find(e => e.elementName === "PoP").time[0].parameter.parameterName;
        const minT = elements.find(e => e.elementName === "MinT").time[0].parameter.parameterName;
        const maxT = elements.find(e => e.elementName === "MaxT").time[0].parameter.parameterName;
        const ci = elements.find(e => e.elementName === "CI").time[0].parameter.parameterName;

        const startTime = elements[0].time[0].startTime;
        const endTime = elements[0].time[0].endTime;

        document.getElementById("weather").innerHTML = `
          <h3>🌤 台南市天氣資訊</h3>
          天氣：<span class="value">${wx}</span><br>
          溫度：<span class="value">${minT}°C ~ ${maxT}°C</span><br>
          降雨機率：<span class="value">${pop}%</span><br>
          舒適度：<span class="value">${ci}</span><br>
          <div class="time">預報時間：${startTime} ～ ${endTime}</div>
        `;
      })
      .catch(err => {
        document.getElementById("weather").innerHTML =
          "⚠️ 天氣資料讀取失敗，請確認 API Key 或網路連線。";
        console.error(err);
      });
  </script>
</body>
</html>
