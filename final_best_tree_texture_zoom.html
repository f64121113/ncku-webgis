<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成功大學光復校區空間資訊平台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft JhengHei", Arial, sans-serif; background: #eef2f6; color: #17212b; }
    .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    .sidebar { background: linear-gradient(180deg,#14213d,#243b63); color: #fff; padding: 22px; overflow-y: auto; box-shadow: 6px 0 18px rgba(0,0,0,.2); z-index: 1000; }
    .brand { margin-bottom: 18px; }
    .brand .tag { display: inline-block; background: rgba(255,255,255,.14); padding: 5px 10px; border-radius: 999px; font-size: 12px; margin-bottom: 10px; }
    .brand h1 { margin: 0; font-size: 24px; line-height: 1.35; }
    .brand p { margin: 8px 0 0; color: #d5deee; font-size: 13px; line-height: 1.7; }
    .panel { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 14px; margin: 14px 0; backdrop-filter: blur(8px); }
    .panel h2 { margin: 0 0 12px; font-size: 16px; }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    button { border: 0; border-radius: 12px; padding: 11px 10px; cursor: pointer; font-family: inherit; font-weight: 700; }
    .mode-btn { background: #f8fafc; color: #1d3557; text-align: left; transition: .15s; }
    .mode-btn:hover, .mode-btn.active { background: #ffd166; color: #1a1a1a; transform: translateY(-1px); }
    .layer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
    .layer:last-child { border-bottom: 0; }
    .switch { transform: scale(1.1); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: rgba(255,255,255,.92); color: #17212b; border-radius: 14px; padding: 12px; }
    .stat b { display: block; font-size: 24px; color: #1d3557; }
    .stat span { font-size: 12px; color: #52616f; }
    .legend { background: rgba(255,255,255,.92); color: #17212b; border-radius: 14px; padding: 12px; line-height: 1.8; font-size: 13px; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .green { background:#2a9d8f; } .yellow { background:#f4a261; } .red { background:#e63946; } .blue { background:#457b9d; } .orange { background:#ff8c42; } .purple { background:#6c63ff; } .arcgis-building { background:#5b9f7a; } .tree-dot { background:#6f8f63; }

    .bike-icon { background:#ff8c42; color:#fff; border:2px solid #fff; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.35); font-size:16px; }
    .road-label { background:rgba(255,255,255,.86); color:#1f3a63; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.12); }
    .bus-icon { background:#6c63ff; color:#fff; border:2px solid #fff; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.35); font-size:15px; }
    .bike-list, .bus-list { max-height: 190px; overflow:auto; background:rgba(255,255,255,.92); color:#17212b; border-radius:12px; padding:10px; font-size:12px; line-height:1.7; }
    .bike-row, .bus-row { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #dde3ea; padding:5px 0; }
    .bike-row:last-child { border-bottom:0; }
    .action { width: 100%; background: #2a9d8f; color: #fff; margin-top: 8px; }
    .action.secondary { background: #457b9d; }
    #map { width: 100%; height: 100vh; background:#f7f8fa; }
    .topbar { position: absolute; top: 16px; left: 382px; right: 18px; z-index: 999; display: flex; gap: 10px; align-items: center; pointer-events: none; }
    .search { pointer-events: auto; flex: 1; max-width: 460px; background: #fff; border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.18); padding: 12px 16px; color: #4c5662; }
    .pill { pointer-events: auto; background: #fff; border-radius: 999px; padding: 10px 14px; box-shadow: 0 8px 22px rgba(0,0,0,.18); font-weight: 700; color: #1d3557; font-size: 13px; }
    .leaflet-popup-content { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; }
    .popup-title { font-weight: 800; font-size: 15px; color: #14213d; }
    .form { display: grid; gap: 8px; }
    .form input, .form select, .form textarea { width: 100%; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.9); border-radius: 10px; padding: 9px; font-family: inherit; }
    @media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: 46vh 54vh; } .sidebar { height: 46vh; } #map { height: 54vh; } .topbar { left: 14px; top: calc(46vh + 12px); right: 14px; } }
  
    .building-shadow {
      filter: drop-shadow(5px 7px 3px rgba(0,0,0,.38));
    }

    .building-label{
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #3e457f;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      text-align: center;
      text-shadow:
        1.5px 1.5px 2px #ffffff,
       -1.5px -1.5px 2px #ffffff,
        1.5px -1.5px 2px #ffffff,
       -1.5px 1.5px 2px #ffffff,
        2px 2px 4px rgba(0,0,0,.45);
      pointer-events: none;
      white-space: nowrap;
    }

    .leaflet-tooltip.building-label::before{
      display:none !important;
    }

  
    /* Professional Morandi refinement */
    :root{
      --ink:#253044;
      --navy:#2f3b59;
      --navy-2:#3e4c70;
      --cream:#f5f2eb;
      --card:#ffffff;
      --muted:#7b8494;
      --line:#d9d6ce;
      --accent:#8a9277;
      --accent-2:#b08b73;
      --flower:#935620;
      --bike:#9b8f7a;
      --bus:#7f8fa6;
    }

    body{
      background: var(--cream) !important;
      color: var(--ink) !important;
    }

    .app{
      grid-template-columns: 340px 1fr !important;
      background: var(--cream);
    }

    .sidebar{
      background: linear-gradient(180deg,#27324d,#3d4a67) !important;
      color:#fff !important;
      padding: 24px 20px !important;
      box-shadow: 10px 0 28px rgba(41,48,64,.18) !important;
    }

    .brand .tag{
      background: rgba(255,255,255,.12) !important;
      border:1px solid rgba(255,255,255,.18);
      color:#ece8df;
      letter-spacing:.3px;
    }

    .brand h1{
      font-size:22px !important;
      letter-spacing:.4px;
    }

    .brand p{
      color:#d9d6ce !important;
      line-height:1.75 !important;
    }

    .panel{
      background: rgba(255,255,255,.105) !important;
      border:1px solid rgba(255,255,255,.16) !important;
      border-radius:18px !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .panel h2{
      color:#f6f2ea;
      font-size:15px !important;
      letter-spacing:.4px;
    }

    .mode-grid{
      grid-template-columns:1fr !important;
      gap:8px !important;
    }

    .mode-btn{
      background: rgba(255,255,255,.92) !important;
      color: var(--navy) !important;
      border:1px solid rgba(255,255,255,.18) !important;
      border-radius:14px !important;
      font-weight:700 !important;
      letter-spacing:.2px;
      padding: 11px 12px !important;
    }

    .mode-btn:hover,
    .mode-btn.active{
      background: #d9d2c3 !important;
      color:#263049 !important;
      transform: translateY(-1px);
    }

    .layer{
      color:#f2eee6;
      border-bottom:1px solid rgba(255,255,255,.12) !important;
      font-size:13px !important;
    }

    .switch{
      accent-color:#d9d2c3;
    }

    .stat,
    .legend,
    .bike-list,
    .bus-list{
      background: rgba(250,248,243,.96) !important;
      color: var(--ink) !important;
      border:1px solid rgba(217,214,206,.8);
      box-shadow: 0 8px 18px rgba(27,34,48,.08);
    }

    .stat b{
      color: var(--navy) !important;
      font-size:22px !important;
    }

    .stat span{
      color: var(--muted) !important;
    }

    .action{
      background: var(--accent) !important;
      color:#fff !important;
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px !important;
      letter-spacing:.3px;
    }

    .action.secondary{
      background: var(--navy-2) !important;
    }

    #map{
      background:#f8f5ef !important;
    }

    .topbar{
      left: 362px !important;
    }

    .search,
    .pill{
      background: rgba(250,248,243,.94) !important;
      color: var(--navy) !important;
      border:1px solid rgba(217,214,206,.85);
      box-shadow: 0 12px 26px rgba(43,50,68,.15) !important;
      backdrop-filter: blur(8px);
    }

    .leaflet-control-layers,
    .leaflet-control-zoom a,
    .leaflet-control-scale-line{
      border:none !important;
      box-shadow: 0 8px 20px rgba(43,50,68,.14) !important;
      color: var(--navy) !important;
    }

    .bike-icon,
    .bus-icon{
      width:28px !important;
      height:28px !important;
      border-radius:50% !important;
      border:2px solid rgba(255,255,255,.92) !important;
      color:#fff !important;
      font-size:0 !important;
      box-shadow:0 4px 12px rgba(41,48,64,.25) !important;
      position:relative;
    }

    .bike-icon{ background: var(--bike) !important; }
    .bus-icon{ background: var(--bus) !important; }

    .bike-icon::after{
      content:"";
      width:9px;
      height:9px;
      border-radius:50%;
      background:#fff;
      opacity:.92;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }

    .bus-icon::after{
      content:"";
      width:11px;
      height:8px;
      border-radius:2px;
      background:#fff;
      opacity:.92;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }

    .dot{
      border-radius:3px !important;
    }

    .arcgis-building{ background:#9aa68f !important; }
    .green{ background:#935620 !important; }
    .tree-dot{ background:#7f8d68 !important; }
    .orange{ background:var(--bike) !important; }
    .purple{ background:var(--bus) !important; }

    .building-shadow{
      filter: drop-shadow(4px 6px 3px rgba(68,64,58,.28)) !important;
    }

    .building-label{
      color:#3f4a66 !important;
      font-size:12px !important;
      font-weight:700 !important;
      letter-spacing:.3px !important;
      text-shadow:
        1.2px 1.2px 2px rgba(255,255,255,.94),
       -1.2px -1.2px 2px rgba(255,255,255,.94),
        1.2px -1.2px 2px rgba(255,255,255,.94),
       -1.2px 1.2px 2px rgba(255,255,255,.94),
        1px 2px 4px rgba(68,64,58,.25) !important;
    }

    .leaflet-popup-content-wrapper{
      border-radius:16px !important;
      box-shadow: 0 12px 28px rgba(41,48,64,.18) !important;
    }

    .popup-title{
      color:var(--navy) !important;
    }

    @media (max-width: 860px){
      .topbar{ left:14px !important; }
    }

<script>
  const map = L.map('map', { zoomControl: false }).setView([22.9973, 120.2196], 17);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);

  // 底圖設定：預設使用純白底圖，讓 ArcGIS 建物、YouBike 與公車站點成為主視覺。
  const blankBase = L.layerGroup();
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    opacity: 0.18
  }).addTo(map);
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenTopoMap',
    opacity: 0.18
  });
  L.control.layers({
    '純白底圖': blankBase,
    '淡化一般底圖（預設）': osm,
    '淡化地形底圖': topo
  }, {}, { position: 'bottomright' }).addTo(map);

  // 預設只開啟：ArcGIS 建物。YouBike 與公車由左側開關或功能模式啟用。
  const arcgisBuildings = L.layerGroup().addTo(map);
  const flowerRoutes = L.layerGroup().addTo(map);
  const treeLayer = L.layerGroup().addTo(map);
  const youbikeLayer = L.layerGroup();
  const busLayer = L.layerGroup();

  function popup(title, html){ return `<div class="popup-title">${title}</div>${html}`; }

  // ArcGIS Online Hosted Feature Layer：光復測區建物
  // 使用 FeatureServer 根網址，並載入可能存在的子圖層。
  // 若你在 ArcGIS Online 重新發布或新增圖層，不需要再手動猜 /0 或 /3；這裡會嘗試讀取 0～5 圖層。
  const arcgisBuildingServiceUrl = "https://services5.arcgis.com/yqmzFsAzBUNEIWLw/arcgis/rest/services/%E5%85%89%E5%BE%A9%E6%B8%AC%E5%8D%80%E5%BB%BA%E7%89%A9/FeatureServer";
  const arcgisBuildingLayerIds = [3];
  let hasFitArcgisBuildings = false;

  arcgisBuildingLayerIds.forEach(function(layerId) {
    const layerUrl = `${arcgisBuildingServiceUrl}/${layerId}`;
    const layer = L.esri.featureLayer({
      url: layerUrl,
      simplifyFactor: 0.35,
      precision: 6,
      style: function(feature) {
        const p = feature.properties || {};
        const name = String(
          p.Name || p.name || p.名稱 || p.建物名稱 || p.建物 || p.BUILDING || p.OBJECTID || ''
        );

        // 莫蘭迪色系：依不同建物名稱分配低飽和色
        let fill = '#a9b1a0'; // 預設鼠尾草灰綠
        if (name.includes('雲平')) fill = '#c6a5b8';
        else if (name.includes('管理')) fill = '#c7b99b';
        else if (name.includes('中正')) fill = '#8fa8a1';
        else if (name.includes('學生活動')) fill = '#9fb3c5';
        else if (name.includes('軍訓')) fill = '#a9adb4';
        else if (name.includes('唯農')) fill = '#aebd9a';
        else if (name.includes('歷史')) fill = '#b98f86';
        else if (name.includes('工業設計')) fill = '#c9c29d';
        else if (name.includes('圖書')) fill = '#9c9eb7';
        else if (name.includes('測量')) fill = '#91a7ad';
        else if (name.includes('建築')) fill = '#b6a08b';

        return {
          color: 'transparent',
          weight: 0,
          fillColor: fill,
          fillOpacity: 0.82,
		  opacity: 1,
          className: 'building-shadow'
        };
      },
      onEachFeature: function(feature, leafletLayer) {
        const p = feature.properties || {};

        // 建物標籤欄位：依序嘗試常見欄位名稱
        const title =
          p.Name ||
          p.name ||
          p.名稱 ||
          p.建物名稱 ||
          p.建物 ||
          p.BUILDING ||
          p.BUILD_NAME ||
          p.Label ||
          p.label ||
          p.標籤 ||
          p.建物標籤 ||
          p.OBJECTID ||
          `光復測區建物 Layer ${layerId}`;

        // 永久顯示建物名稱 Label
        if (title) {
          leafletLayer.bindTooltip(String(title), {
            permanent: true,
            direction: 'center',
            className: 'building-label',
            opacity: 1
          });
        }

        const fields = Object.keys(p).slice(0, 8).map(k => `${k}：${p[k]}`).join('<br>');
        leafletLayer.bindPopup(popup('🏢 ' + title, `${fields}<br>資料來源：ArcGIS Online Feature Layer<br>圖層編號：${layerId}`));
      }
    }).addTo(arcgisBuildings);

    layer.on('load', function() {
      if (hasFitArcgisBuildings) return;
      try {
        const b = layer.getBounds();
        if (b && b.isValid()) {
          map.fitBounds(b, { padding: [25, 25], maxZoom: 18 });
          hasFitArcgisBuildings = true;
        }
      } catch(e) {}
    });
  });


  // ArcGIS Online Hosted Feature Layer：光復校區花圃路線
  const flowerRouteServiceUrl = "https://services5.arcgis.com/yqmzFsAzBUNEIWLw/arcgis/rest/services/%E5%85%89%E5%BE%A9%E6%A0%A1%E5%8D%80%E8%8A%B1%E5%9C%83%E8%B7%AF%E7%B7%9A/FeatureServer";
  const flowerRouteLayerIds = [2];

  flowerRouteLayerIds.forEach(function(layerId) {
    const layerUrl = `${flowerRouteServiceUrl}/${layerId}`;
    const layer = L.esri.featureLayer({
      url: layerUrl,
      simplifyFactor: 0.35,
      precision: 6,
      style: function(feature) {
        return {
          color: '#935620',
          weight: 1.2,
          opacity: 1
        };
      },
      onEachFeature: function(feature, leafletLayer) {
        const p = feature.properties || {};
        const title =
          p.Name ||
          p.name ||
          p.名稱 ||
          p.路線名稱 ||
          p.花圃名稱 ||
          p.OBJECTID ||
          `光復校區花圃路線 Layer ${layerId}`;

        const fields = Object.keys(p).slice(0, 8).map(k => `${k}：${p[k]}`).join('<br>');
        leafletLayer.bindPopup(popup('🌿 ' + title, `${fields}<br>資料來源：ArcGIS Online Feature Layer<br>圖層編號：${layerId}`));
      }
    }).addTo(flowerRoutes);
  });


  // ArcGIS Online Hosted Feature Layer：測區樹木
  const treeServiceUrl = "https://services5.arcgis.com/yqmzFsAzBUNEIWLw/arcgis/rest/services/%E6%B8%AC%E5%8D%80%E6%A8%B9%E6%9C%A8/FeatureServer";
  const treeLayerIds = [0];
  const treeIcon = L.divIcon({
    className: '',
    html: '<div class="tree-icon"></div>',
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-14]

  treeLayerIds.forEach(function(layerId) {
    const layerUrl = `${treeServiceUrl}/${layerId}`;

      url: layerUrl,
      simplifyFactor: 0.35,
      precision: 6,
      pointToLayer: function(feature, latlng) {
        return L.marker(latlng, { icon: treeIcon });
      },
      style: function(feature) {
        return {
          color: '#6f8f63',
          weight: 1,
          opacity: 0.9,
          fillColor: '#7f8d68',
          fillOpacity: 0.55
        };
      },
      onEachFeature: function(feature, leafletLayer) {
        const p = feature.properties || {};
        const title =
          p.Name ||
          p.name ||
          p.名稱 ||
          p.樹種 ||
          p.樹木名稱 ||
          p.SPECIES ||
          p.OBJECTID ||
          `測區樹木 Layer ${layerId}`;

        const fields = Object.keys(p).slice(0, 8).map(k => `${k}：${p[k]}`).join('<br>');
        leafletLayer.bindPopup(popup('🌳 ' + title, `${fields}<br>資料來源：ArcGIS Online Feature Layer<br>圖層編號：${layerId}`));
      }
    }).addTo(treeLayer);
  });

  const busIcon = L.divIcon({ className: '', html: '<div class="bus-icon">🚌</div>', iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-14] });

  function formatBusArrivals(arrivals) {
    if(!arrivals || arrivals.length === 0) return '目前無到站資料';
    return arrivals.map(a => {
      const route = a.route || '未知路線';
      const label = a.label || '無資料';
      return `🚌 <b>${route}</b>：${label}<br><span style="color:#697386">${a.subroute || ''}</span>`;
    }).join('<hr style="border:0;border-top:1px solid #dde3ea;margin:6px 0;">');
  }

  function renderBus() {
    let routes = new Set();
    let soonCount = 0;
    let candidates = [];
    busData.forEach(s => {
      (s.arrivals || []).forEach(a => {
        if(a.route) routes.add(a.route);
        if(typeof a.eta === 'number' && a.eta <= 1800) soonCount++;
        if(typeof a.eta === 'number') candidates.push({stop:s, arrival:a});
      });
      const marker = L.marker([s.lat, s.lon], {icon: busIcon}).bindPopup(popup('🚌 ' + s.name, `
        地址：${s.address || '未提供'}<br>
        方位：${s.bearing || '未提供'}<br>
        <hr>
        ${formatBusArrivals(s.arrivals)}<br>
        <span style="color:#697386">資料來源：TDX Bus NearBy API 快照</span>
      `));
      marker.stop = s;
      marker.addTo(busLayer);
    });

    candidates.sort((a,b)=>a.arrival.eta-b.arrival.eta);
    if(candidates.length) {
      const first = candidates[0].stop;
      soonBusMarker = [...busLayer.getLayers()].find(m => m.stop && m.stop.uid === first.uid);
    }

    document.getElementById('busStopCount').innerText = busData.length;
    document.getElementById('busRouteCount').innerText = routes.size;
    document.getElementById('busSoonCount').innerText = soonCount;
    document.getElementById('busDataTime').innerText = busData.reduce((n,s)=>n+(s.arrivals?s.arrivals.length:0),0);
    document.getElementById('busList').innerHTML = candidates.slice(0,8).map(c => `
      <div class="bus-row">
        <span>${c.stop.name}｜${c.arrival.route}路</span>
        <b>${c.arrival.label}</b>
      </div>
    `).join('') || '<div>目前沒有可顯示的到站資料</div>';
  }
  renderBus();

  function focusSoonBusStop() {
    if(!map.hasLayer(busLayer)) map.addLayer(busLayer);
    if(soonBusMarker) {
      map.setView([soonBusMarker.stop.lat, soonBusMarker.stop.lon], 17);
      soonBusMarker.openPopup();
    }
  }

  function setMode(mode, btn){
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const names = {campus:'校園導覽', bike:'YouBike 即時站點', bus:'公車到站資訊'};
    document.getElementById('modeText').innerText = '目前模式：' + names[mode];

    if(mode==='campus'){
      map.addLayer(arcgisBuildings);
      map.addLayer(flowerRoutes);
      map.addLayer(treeLayer);
      map.removeLayer(youbikeLayer);
      map.removeLayer(busLayer);
    }

    if(mode==='bike'){
      map.addLayer(youbikeLayer);
      map.setView([22.998,120.220], 15);
    }

    if(mode==='bus'){
      map.addLayer(busLayer);
      map.setView([22.998,120.220], 15);
    }
  }

  /*
    若要改成真正即時串接 TDX：
    1. 不建議把 Client Secret 寫在前端 HTML。
    2. 正式版應用後端或雲端函式取得 Access Token。
    3. 前端再呼叫自己的後端 API，取得 Station/NearBy 與 Availability/NearBy 合併後的資料。
  */
